[versions]
clikt = "5.1.0"
kotlin = "2.4.21"
kotlin-logging = "8.0.4"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
ktlint = "14.2.0"
logback = "1.6.6"
microsoft-iot-client = "2.5.1"
slf4j = "2.0.20"

[libraries]
clikt = { group = "com.github.ajalt.clikt", name = "clikt", version.ref = "clikt" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging", version.ref = "kotlin-logging" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
microsoft-iot-client = { group = "com.microsoft.azure.sdk.iot", name = "iot-device-client", version.ref = "microsoft-iot-client" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
