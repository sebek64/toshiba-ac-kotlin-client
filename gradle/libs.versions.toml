[versions]

[libraries]
clikt = { group = "com.github.ajalt.clikt", name = "clikt", version = "5.1.0" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging", version = "8.0.03" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version = "1.11.0" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.11.0" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version = "1.5.32" }
microsoft-iot-client = { group = "com.microsoft.azure.sdk.iot", name = "iot-device-client", version = "2.5.1" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version = "2.0.18" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.3.21" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.3.21" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
